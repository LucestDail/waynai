# ===========================================================
# WaynAI Backend - application.properties
# ===========================================================
# 민감정보(API Key 등)는 전부 환경변수로 주입합니다.
# 로컬 개발은 프로젝트 루트의 .env 를 사용해주세요.
#   (start-backend-dev.sh 가 자동으로 .env 를 로드합니다)
# 운영 서버는 /etc/systemd/... 또는 /var/www/key/... 에서 가져옵니다.
# -----------------------------------------------------------

# ---- Server ----
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# ---- Application Info ----
spring.application.name=waynai-backend
info.app.name=WaynAI Backend Service
info.app.version=1.1.0
info.app.description=LLM \uae30\ubc18 \uad00\uad11 \ucf54\uc2a4 \uc0dd\uc131 \uc11c\ube44\uc2a4

# ---- Logging ----
logging.level.com.waynai.demo=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ---- Jackson ----
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Seoul

# ---- CORS (\ucf54\ub4dc\uc5d0\uc11c WebConfig \ub85c \uc81c\uc5b4) ----
waynai.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ===========================================================
# \u2728 Gemini LLM \uc124\uc815
# ===========================================================
# gemini.api.key : \ud0a4\ub294 \ud558\ub098\uc758 \uacf3(\ud658\uacbd\ubcc0\uc218)\uc5d0\uc11c\ub9cc \uad00\ub9ac.
# gemini.model.chain : \uc800\uac00 \ubaa8\ub378 \u2192 \uace0\uac00 \ubaa8\ub378 \uc21c. \uc2e4\ud328(429/5xx/quota) \uc2dc \ub2e4\uc74c \ubaa8\ub378\ub85c \ud56b\uc2a4\uc651.
# --- OpenRouter (OpenAI 호환). 과거 Gemini 대체. ---
# 모델 슬러그 형식: openai/gpt-4o-mini, google/gemini-2.5-flash, anthropic/claude-3.5-haiku ...
# 저가→고가 순으로 여러 개 쉼표 나열 시 실패(429/5xx/quota) 때 자동 핫스왑.
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.model.chain=${OPENROUTER_MODEL_CHAIN:deepseek/deepseek-v3.2,deepseek/deepseek-chat,z-ai/glm-4.7-flash}
openrouter.api.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
# 재시도 0: 느린 모델을 두 번 시도해 시간 낭비하지 말고 즉시 다음 모델로 핫스왑.
openrouter.retry.per-model=${OPENROUTER_RETRY_PER_MODEL:0}
# 상세 일정(날씨·숙소·비용 등) JSON 은 출력이 길어 저가 모델에서 오래 걸림 → 240초.
# (프론트는 부분 파싱으로 실시간 표시하고, 잘려도 완성분을 결과로 승격하므로 UX 는 유지)
openrouter.request.timeout-seconds=${OPENROUTER_TIMEOUT_SECONDS:240}
openrouter.referer=${OPENROUTER_REFERER:https://waynai.app}
openrouter.title=${OPENROUTER_TITLE:WaynAI}
# 프로바이더 라우팅 정렬: throughput(속도 우선) | price | latency. 빈 값이면 OpenRouter 기본.
openrouter.provider-sort=${OPENROUTER_PROVIDER_SORT:throughput}
# 로컬 개발 전용. JVM cacerts 에 Google 루트 CA 가 없을 때만 true. 운영에서는 반드시 false.
gemini.tls.insecure=${GEMINI_TLS_INSECURE:false}

# ===========================================================
# \uac80\uc0c9 / \uad00\uad11 API
# ===========================================================
naver.api.client.id=${NAVER_CLIENT_ID:}
naver.api.client.secret=${NAVER_CLIENT_SECRET:}
naver.api.url=https://openapi.naver.com/v1/search/blog

# \ud55c\uad6d\uad00\uad11\uacf5\uc0ac \uacf5\uacf5\ub370\uc774\ud130 \uc11c\ube44\uc2a4\ud0a4 (3\uac1c \uc5d4\ub4dc\ud3ec\uc778\ud2b8 \uacf5\uc6a9)
tour.api.service-key=${TOUR_API_SERVICE_KEY:}

data.api.url.LocgoHubTarService1.areaBasedList1=https://apis.data.go.kr/B551011/LocgoHubTarService1/areaBasedList1
data.api.url.LocgoHubTarService1.areaBasedList1.serviceKey=${tour.api.service-key}

data.api.url.TarRlteTarService1.areaBasedList1=https://apis.data.go.kr/B551011/TarRlteTarService1/areaBasedList1
data.api.url.TarRlteTarService1.areaBasedList1.serviceKey=${tour.api.service-key}

data.api.url.TarRlteTarService1.searchKeyword1=https://apis.data.go.kr/B551011/TarRlteTarService1/searchKeyword1
data.api.url.TarRlteTarService1.searchKeyword1.serviceKey=${tour.api.service-key}

# 좌표기반(모바일 GPS) 주변 관광지 — KorService2.locationBasedList2 (신버전)
data.api.url.KorService2.locationBasedList2=https://apis.data.go.kr/B551011/KorService2/locationBasedList2
data.api.url.KorService2.locationBasedList2.serviceKey=${tour.api.service-key}

# 좌표기반 구버전 폴백 — KorService1.locationBasedList1 (서비스키 공용)
data.api.url.KorService1.locationBasedList1=https://apis.data.go.kr/B551011/KorService1/locationBasedList1
data.api.url.KorService1.locationBasedList1.serviceKey=${tour.api.service-key}

# ===========================================================
# ✈️ Travelpayouts(Aviasales) 항공권 가격 API
# ===========================================================
# token : https://www.travelpayouts.com 가입 후 발급. 미설정 시 항공권 조회 자동 비활성화.
# marker: (선택) 제휴 예약 링크 커미션 트래킹용 마커.
travelpayouts.api.token=${TRAVELPAYOUTS_TOKEN:}
travelpayouts.api.marker=${TRAVELPAYOUTS_MARKER:}
travelpayouts.api.cheap-url=https://api.travelpayouts.com/v1/prices/cheap
travelpayouts.autocomplete-url=https://autocomplete.travelpayouts.com/places2
travelpayouts.default-origin=${TRAVELPAYOUTS_DEFAULT_ORIGIN:SEL}
travelpayouts.default-currency=${TRAVELPAYOUTS_CURRENCY:krw}
# Hotellook(호텔 검색)은 동일 Travelpayouts 토큰/마커 재사용.
hotellook.token=${TRAVELPAYOUTS_TOKEN:}
hotellook.marker=${TRAVELPAYOUTS_MARKER:}

# 국내 숙소 실가격 크롤(여기어때 SSR JSON). 개인용·best-effort. 끄려면 false.
hotel.crawl.enabled=true

# ===========================================================
# 🗺️ OpenRouteService 경로 API (실제 이동시간/거리)
# ===========================================================
# https://openrouteservice.org 무료 키. 미설정 시 이동시간 계산만 비활성.
openrouteservice.api.key=${ORS_API_KEY:}
openrouteservice.api.base-url=https://api.openrouteservice.org/v2/directions

# ===========================================================
# 🔎 Tavily 웹 검색 (해외 여행 정보 RAG)
# ===========================================================
# https://tavily.com 무료 키. 미설정 시 웹 검색만 비활성.
tavily.api.key=${TAVILY_API_KEY:}
tavily.api.url=https://api.tavily.com/search
tavily.max-results=${TAVILY_MAX_RESULTS:5}

# 여행 계획 파일 저장소 (DB 없이 물리 저장, 단일 사용자용)
waynai.storage.dir=./data/plans

# daero 대중교통 경로엔진(자체 RAPTOR) 연동. 국내 구간 대중교통(버스·지하철·기차+요금) 보강.
# 공개 인스턴스가 기본 → 로컬 daero 없이도 동작. 로컬 daero 기동 시 http://localhost:8090 로 오버라이드하면 빠름.
# 빈 값이면 자동 비활성. 환경변수 DAERO_BASE_URL 로도 주입 가능.
daero.base-url=${DAERO_BASE_URL:https://daero.duckdns.org}
